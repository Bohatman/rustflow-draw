[package]
name = "rustflow-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "100% Rust HTTP/WASM static server and WebSocket realtime collaboration & duel hub"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rustflow-collab-protocol = { path = "../../crates/collab-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br", "set-header"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
