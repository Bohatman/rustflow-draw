  <title>Bohat Draw.io — 100% Rust</title>
  
<script type="module">
import init, * as bindings from '/bohat-draw-f6aee07a62df6de.js';
const wasm = await init({ module_or_path: '/bohat-draw-f6aee07a62df6de_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    :root {
      --vvh: 100dvh;
      --vv-top: 0px;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #c8c8cc;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    #app_shell {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--vv-top, 0px);
      width: 100vw;
      height: var(--vvh, 100dvh);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      overflow: hidden;
      background: #c8c8cc;
    }
    canvas#bohat_canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
      outline: none;
    }
  </style>
  <script>
    (function() {
      function syncViewport() {
        var vv = window.visualViewport;
        var h = vv ? vv.height : window.innerHeight;
        var top = vv ? vv.offsetTop : 0;
        document.documentElement.style.setProperty('--vvh', Math.floor(h) + 'px');
        document.documentElement.style.setProperty('--vv-top', Math.floor(top) + 'px');
      }
      window.addEventListener('resize', syncViewport, { passive: true });
      window.addEventListener('orientationchange', function() {
        setTimeout(syncViewport, 60);
        setTimeout(syncViewport, 240);
      }, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewport, { passive: true });
        window.visualViewport.addEventListener('scroll', syncViewport, { passive: true });
      }
      window.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key && e.key.toLowerCase() === 's') {
          e.preventDefault();
        }
      }, true);
      document.addEventListener('DOMContentLoaded', syncViewport);
      syncViewport();
    })();
  </script>
