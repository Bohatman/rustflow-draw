      letter-spacing: -0.2px;

      width: 180px;
      height: 4px;
      border-radius: 999px;
      background: #d5dae5;
      overflow: hidden;
    }
    .bohat-splash-bar::after {
      content: "";
      display: block;
      width: 48%;
      height: 100%;
      border-radius: 999px;
      background: #2563eb;
      animation: bohat-indet 1.1s ease-in-out infinite;
    }
    @keyframes bohat-indet {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }

  <script>
    (function() {
      window.__bohatDirty = false;
      var lastAppliedH = 0;
      var rafPending = false;
      function isTextInputActive() {
        var el = document.activeElement;
        if (!el) return false;
        var tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
      }
      function applyViewportNow(force) {
        rafPending = false;
        if (!force && isTextInputActive()) {
          return;
        }
        var h = window.innerHeight;
        if (!isTextInputActive() && window.visualViewport) {
          var vvh = window.visualViewport.height;
          if (vvh > 0 && Math.abs(vvh - h) < 120) {
            h = vvh;
          }
        }
        var floored = Math.floor(h);
        if (force || Math.abs(floored - lastAppliedH) >= 2) {
          lastAppliedH = floored;
          document.documentElement.style.setProperty('--vvh', floored + 'px');
          document.documentElement.style.setProperty('--vv-top', '0px');
        }
      }
      function syncViewport() {
        if (isTextInputActive() || rafPending) return;
        rafPending = true;
        requestAnimationFrame(function() { applyViewportNow(false); });
      }
      window.addEventListener('resize', syncViewport, { passive: true });
      window.addEventListener('orientationchange', function() {
        setTimeout(function() { applyViewportNow(true); }, 120);
        setTimeout(function() { applyViewportNow(true); }, 320);
      }, { passive: true });
      window.addEventListener('focusout', function() {
        setTimeout(function() { applyViewportNow(false); }, 180);
      }, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewport, { passive: true });
      }
      window.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key && e.key.toLowerCase() === 's') {
          e.preventDefault();
        }
      }, true);
      window.addEventListener('beforeunload', function(e) {
        if (window.__bohatDirty) {
          e.preventDefault();
          e.returnValue = '';
        }
      });
      window.__bohatHideSplash = function() {
        var el = document.getElementById('bohat_splash');
        if (el && !el.classList.contains('hidden')) {
          el.classList.add('hidden');
          setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
        }
      };
      document.addEventListener('DOMContentLoaded', syncViewport);
      syncViewport();
    })();
