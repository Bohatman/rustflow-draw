name: CD — Web Staging & Desktop Release Builds

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

jobs:
  deploy-web:
    name: Build & Stage Web Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM bridge
        run: cargo build -p rustflow-ui-bridge --target wasm32-unknown-unknown --release
      - name: Upload Web staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustflow-web-bundle
          path: apps/web/

  release-desktop:
    name: Build Desktop Binaries (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Desktop Release Binary
        run: cargo build -p rustflow-desktop --release
