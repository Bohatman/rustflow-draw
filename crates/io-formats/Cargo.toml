[package]
name = "rustflow-io-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native JSON serializer, bidirectional .drawio XML parser/exporter, and animated SVG/PDF export"

[dependencies]
rustflow-core = { path = "../core" }
rustflow-renderer = { path = "../renderer" }
png = "0.17"
gif = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
